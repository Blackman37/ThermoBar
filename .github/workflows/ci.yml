name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Deterministic tests (no live sensors)
        run: ./test.sh
      - name: Analyze C bridge
        run: xcrun clang --analyze -Wall -Wextra -Werror -I Sources/SensorBridge/include -Xanalyzer -analyzer-output=text Sources/SensorBridge/Sensors.c
      - name: Build and verify app bundle
        run: |
          ./build.sh
          codesign --verify --strict --verbose=2 build/ThermoBar.app
